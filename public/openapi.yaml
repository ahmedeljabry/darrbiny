openapi: 3.0.3
info:
  title: Learn Car Driving API
  version: 1.0.0
servers:
  - url: http://localhost/api/v1
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /plans:
    get:
      summary: List active plans
      parameters:
        - in: query
          name: country_id
          schema: { type: string }
        - in: query
          name: city_id
          schema: { type: string }
        - in: query
          name: training_type
          schema: { type: string }
      responses:
        '200': { description: OK }
  /user-requests:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a user request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string }
                start_date: { type: string, format: date }
                has_user_car: { type: boolean }
                wants_trainer_car: { type: boolean }
                needs_pickup: { type: boolean }
              required: [plan_id, start_date, has_user_car, wants_trainer_car, needs_pickup]
      responses:
        '201': { description: Created }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
