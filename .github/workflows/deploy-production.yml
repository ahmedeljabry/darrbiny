name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          if-no-files-found: error

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://darrbiny.com

    env:
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_BRANCH: master
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Validate deploy secrets
        id: deploy-config
        run: |
          missing=0

          if [ -z "$SSH_HOST" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_HOST"
            missing=1
          fi

          if [ -z "$SSH_USERNAME" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_USERNAME"
            missing=1
          fi

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_DEPLOY_PATH"
            missing=1
          fi

          if [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_KEY" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_PASSWORD or PRODUCTION_SSH_KEY"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy skipped until required secrets are configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH client
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

          if [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          elif [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/production_deploy_key"
            chmod 600 "$HOME/.ssh/production_deploy_key"
          fi

      - name: Prepare remote shell for file uploads
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"

          remote_shell() {
            if [ -n "$SSH_PASSWORD" ]; then
              sshpass -p "$SSH_PASSWORD" ssh -tt -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" 'bash -s'
            else
              ssh -tt -i "$HOME/.ssh/production_deploy_key" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" 'bash -s'
            fi
          }

          remote_shell <<'REMOTE_SHELL'
            set -e

            touch "$HOME/.bashrc"

            if ! grep -q 'DARRBINY_NON_INTERACTIVE_GUARD' "$HOME/.bashrc"; then
              cp "$HOME/.bashrc" "$HOME/.bashrc.bak.darrbiny-$(date +%Y%m%d%H%M%S)"
              tmp_file="$(mktemp)"
              {
                printf '%s\n' '# DARRBINY_NON_INTERACTIVE_GUARD: keep deploy SCP/SSH commands quiet.'
                printf '%s\n' 'case $- in'
                printf '%s\n' '  *i*) ;;'
                printf '%s\n' '  *) return ;;'
                printf '%s\n' 'esac'
                printf '\n'
                cat "$HOME/.bashrc"
              } > "$tmp_file"
              mv "$tmp_file" "$HOME/.bashrc"
            fi
          REMOTE_SHELL

      - name: Create incremental git bundle
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"

          remote_path="$(printf '%q' "$DEPLOY_PATH")"

          remote_exec() {
            if [ -n "$SSH_PASSWORD" ]; then
              sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "$@"
            else
              ssh -i "$HOME/.ssh/production_deploy_key" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "$@"
            fi
          }

          remote_head="$(remote_exec "cd $remote_path && git rev-parse HEAD")"
          echo "Production HEAD: $remote_head"

          git branch -f deploy-production "$GITHUB_SHA"

          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            base_ref="$(git rev-parse "${GITHUB_SHA}^")"
            git bundle create deploy-production.bundle deploy-production "^$base_ref"
          elif git merge-base --is-ancestor "$remote_head" "$GITHUB_SHA"; then
            git bundle create deploy-production.bundle deploy-production "^$remote_head"
          else
            echo "::warning::Production HEAD is not an ancestor of this commit. Creating a full bundle."
            git bundle create deploy-production.bundle deploy-production
          fi

          git branch -D deploy-production
          tar -czf public-build.tar.gz public/build

      - name: Upload deploy bundle and frontend build
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"

          scp_file() {
            if [ -n "$SSH_PASSWORD" ]; then
              sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" "$1" "$SSH_USERNAME@$SSH_HOST:$2"
            else
              scp -i "$HOME/.ssh/production_deploy_key" -P "$SSH_PORT" "$1" "$SSH_USERNAME@$SSH_HOST:$2"
            fi
          }

          scp_file deploy-production.bundle "/tmp/darrbiny-${GITHUB_SHA}.bundle"
          scp_file public-build.tar.gz "/tmp/darrbiny-public-build-${GITHUB_SHA}.tar.gz"

      - name: Deploy over SSH
        if: steps.deploy-config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"

          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          remote_bundle="/tmp/darrbiny-${GITHUB_SHA}.bundle"
          remote_build="/tmp/darrbiny-public-build-${GITHUB_SHA}.tar.gz"

          deploy_ssh() {
            if [ -n "$SSH_PASSWORD" ]; then
              sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "DEPLOY_PATH=$remote_path DEPLOY_SHA=$GITHUB_SHA DEPLOY_BUNDLE=$remote_bundle DEPLOY_BUILD=$remote_build bash -s"
            else
              ssh -i "$HOME/.ssh/production_deploy_key" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "DEPLOY_PATH=$remote_path DEPLOY_SHA=$GITHUB_SHA DEPLOY_BUNDLE=$remote_bundle DEPLOY_BUILD=$remote_build bash -s"
            fi
          }

          deploy_ssh <<'REMOTE_DEPLOY'
            set -e

            if [ -z "$DEPLOY_PATH" ]; then
              echo "Missing GitHub secret: PRODUCTION_DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f artisan ]; then
              echo "Deploy path does not contain a Laravel app checkout: $DEPLOY_PATH"
              exit 1
            fi

            cleanup() {
              php artisan up || true
            }
            trap cleanup EXIT

            php artisan down || true

            git bundle verify "$DEPLOY_BUNDLE"
            git fetch "$DEPLOY_BUNDLE" +refs/heads/deploy-production:refs/remotes/local/deploy-production
            git checkout master
            git reset --hard refs/remotes/local/deploy-production
            tar -xzf "$DEPLOY_BUILD" -C "$DEPLOY_PATH"

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            if [ -f package.json ] && command -v npm >/dev/null 2>&1; then
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              else
                npm install --no-audit --no-fund
              fi
              npm run build
            fi

            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            php artisan queue:restart || true

            trap - EXIT
            php artisan up
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            rm -f "$DEPLOY_BUNDLE" "$DEPLOY_BUILD"
          REMOTE_DEPLOY
