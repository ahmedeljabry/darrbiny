name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://darrbiny.com

    env:
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_BRANCH: master
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.PRODUCTION_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        id: deploy-config
        run: |
          missing=0

          if [ -z "$SSH_HOST" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_HOST"
            missing=1
          fi

          if [ -z "$SSH_USERNAME" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_USERNAME"
            missing=1
          fi

          if [ -z "$DEPLOY_PATH" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_DEPLOY_PATH"
            missing=1
          fi

          if [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_KEY" ]; then
            echo "::notice::Missing GitHub secret: PRODUCTION_SSH_PASSWORD or PRODUCTION_SSH_KEY"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production deploy skipped until required secrets are configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload application files
        if: steps.deploy-config.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "."
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true
          rm: false

      - name: Deploy over SSH
        if: steps.deploy-config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_BRANCH
          script: |
            set -e

            if [ -z "$DEPLOY_PATH" ]; then
              echo "Missing GitHub secret: PRODUCTION_DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f artisan ]; then
              echo "Deploy path does not contain a Laravel app checkout: $DEPLOY_PATH"
              exit 1
            fi

            cleanup() {
              php artisan up || true
            }
            trap cleanup EXIT

            php artisan down || true

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            if [ -f package.json ] && command -v npm >/dev/null 2>&1; then
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              else
                npm install --no-audit --no-fund
              fi
              npm run build
            fi

            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            php artisan queue:restart || true

            trap - EXIT
            php artisan up
